  - abuse.ch
  - urlhaus.abuse.ch
  - malwarebazaar.abuse.ch
  - threatfox.abuse.ch
  - alienvault.com
  - otx.alienvault.com
  - hybrid-analysis.com
  - joesandbox.com
  - any.run
  - app.any.run
  - intezer.com
  - analyze.intezer.com
  - virusscan.jotti.org
  - talosintelligence.com
  - blog.talosintelligence.com
  - securelist.com
  - microsoft.com
  - msdn.microsoft.com
  - docs.microsoft.com
  - learn.microsoft.com
  - support.microsoft.com
  - google.com
  - github.com
  - twitter.com
  - x.com
  - facebook.com
  - linkedin.com
  - reddit.com
  - medium.com
  - wikipedia.org
  - archive.org
